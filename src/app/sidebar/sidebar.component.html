<aside class="sidebar" [class.open]="uiService.isSidebarOpen()" [class.mini]="sidebarMiniEnabled()" (click)="onSidebarClick($event)">
  <button class="close-btn" (click)="uiService.closeSidebar()" aria-label="Close menu">
    <i class="fas fa-times"></i>
  </button>
  @if (!sidebarMiniEnabled()) {
    <img [src]="profileImage()" alt="Foto personal" class="foto-perfil" />
    <h2 class="nombre">Pablo Zurita</h2>
    <p class="subtitulo">Estudiante de Ingeniería de Software</p>
    <a [routerLink]="contactBtnLink()" class="btn-contacto" (click)="uiService.closeSidebar()">{{ contactBtnLabel() }}</a>

    <div class="social-icons">
      <a href="https://github.com/zurupe" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://www.linkedin.com/in/pablo-zurita-rosero-4298163b9/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <i class="fab fa-linkedin"></i>
      </a>
      <a href="https://hub.docker.com/u/zurupe" target="_blank" rel="noopener noreferrer" aria-label="Docker">
        <i class="fab fa-docker"></i>
      </a>
    </div>

    <br>

    <small class="frase">"El conocimiento se construye línea a línea, como un buen código"</small>
    <br>
  }

  @if (sidebarMiniEnabled()) {
    <div class="mini-sidebar">
      <div class="mini-avatar">
        <img [src]="profileImage()" alt="Foto personal" />
      </div>
      <a
        [routerLink]="contactBtnLink()"
        class="mini-contact"
        [attr.aria-label]="contactBtnLabel()"
        (click)="uiService.closeSidebar()"
      >
        <span>{{ contactBtnLabel() }}</span>
      </a>
      <div class="mini-social-icons">
        <a href="https://github.com/zurupe" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <i class="fab fa-github" aria-hidden="true"></i>
        </a>
        <a href="https://www.linkedin.com/in/pablo-zurita-rosero-4298163b9/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <i class="fab fa-linkedin" aria-hidden="true"></i>
        </a>
        <a href="https://hub.docker.com/u/zurupe" target="_blank" rel="noopener noreferrer" aria-label="Docker">
          <i class="fab fa-docker" aria-hidden="true"></i>
        </a>
      </div>
    </div>
  }

  <nav class="mobile-nav">
    <ul class="mobile-ul">
      <li><a routerLink="/" (click)="uiService.closeSidebar()">Inicio</a></li>
      <li><a routerLink="/sobre-mi" (click)="uiService.closeSidebar()">Sobre Mí</a></li>
      <li><a routerLink="/proyectos" (click)="uiService.closeSidebar()">Proyectos</a></li>
    </ul>
  </nav>
</aside>
